[project]
name = "rocket-design"
description = "Rocket design RL: mission prompt in, OpenRocket design out, scored by rocket_reward (7-stage ladder + OpenRocket 24.12)"
tags = ["rocketry", "openrocket", "single-turn", "train", "eval"]
version = "0.2.0"
requires-python = ">=3.10"
# rocket_reward uses only the Python standard library plus a JDK 17+ and OpenRocket-24.12.jar
# (see rocket_reward/README.md).
dependencies = [
    "verifiers>=0.4",  # the v1 API: Taskset / Task / @vf.reward
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["rocket_design.py", "pyproject.toml", "README.md"]
